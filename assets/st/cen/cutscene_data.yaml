  - [SET_SPEED, 2]
  - [TEXT, "You were"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "right. "]
  - [SET_WAIT, 32]
  - [TEXT, "He has joined"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "forces with the"]
