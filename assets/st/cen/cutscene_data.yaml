  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x3ce]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [TEXT, "If you wear these,"]
  - [LINE_BREAK]
  - [SET_WAIT, 24]
