script:
  - [SET_EVENTS, 0x80181f6d]
  - [SCRIPT_UNKNOWN_11]
  - [WAIT_FOR_FLAG, 0]
  - [SET_POS, 60, 28]
  - [LOAD_PORTRAIT, 0x8018b6a8, 0]
  - [SET_PORTRAIT, 1, 128]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x36e]
  - [WAIT_FOR_SOUND]
  - [SET_FLAG, 2]
  - [SET_SPEED, 4]
  - [TEXT, "Impressive."]
  - [LINE_BREAK]
  - [SET_WAIT, 16]
  - [SET_FLAG, 3]
  - [SET_SPEED, 3]
  - [TEXT, "You're very strong."]
  - [SET_WAIT, 48]
  - [NEXT_DIALOG]
  - [LOAD_PORTRAIT, 0x8018a928, 1]
  - [SET_PORTRAIT, 0, 1]
  - [SET_SPEED, 4]
  - [TEXT, "........."]
  - [LINE_BREAK]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x36f]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [TEXT, "What is it you want?"]
  - [LINE_BREAK]
  - [SET_WAIT, 8]
  - [TEXT, "You didn't come here"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [SET_FLAG, 4]
  - [TEXT, "to tell me that."]
  - [SET_WAIT, 48]
  - [NEXT_DIALOG]
  - [SET_PORTRAIT, 1, 128]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x370]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [SET_FLAG, 5]
  - [TEXT, "You're right."]
  - [LINE_BREAK]
  - [SET_WAIT, 24]
  - [SET_FLAG, 6]
  - [SET_SPEED, 2]
  - [TEXT, "Do you know the name"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [SET_FLAG, 7]
  - [TEXT, "Richter Belmont?"]
  - [SET_WAIT, 48]
  - [NEXT_DIALOG]
  - [SET_PORTRAIT, 0, 1]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x371]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 3]
  - [SET_FLAG, 14]
  - [TEXT, "Of the Belmont Clan?"]
  - [LINE_BREAK]
  - [SET_WAIT, 8]
  - [TEXT, "Of course, but..."]
  - [SET_WAIT, 48]
  - [NEXT_DIALOG]
  - [SET_PORTRAIT, 1, 128]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x372]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 3]
  - [SET_FLAG, 8]
  - [TEXT, "He disappeared about"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "a year ago "]
  - [SET_WAIT, 16]
  - [SET_FLAG, 9]
  - [SET_SPEED, 2]
  - [TEXT, "and I'm"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "sure he's here."]
  - [LINE_BREAK]
  - [SET_WAIT, 32]
  - [SET_FLAG, 10]
  - [TEXT, "If you see him,"]
  - [LINE_BREAK]
  - [SET_WAIT, 28]
  - [TEXT, "please let me know."]
  - [SET_WAIT, 48]
  - [NEXT_DIALOG]
  - [SET_PORTRAIT, 0, 1]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x373]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [SET_FLAG, 11]
  - [TEXT, "As you wish, my lady."]
  - [SET_WAIT, 48]
  - [NEXT_DIALOG]
  - [SET_PORTRAIT, 1, 128]
  - [SCRIPT_UNKNOWN_11]
  - [PLAY_SOUND, 0x374]
  - [WAIT_FOR_SOUND]
  - [SET_SPEED, 2]
  - [SET_FLAG, 12]
  - [TEXT, "Thank you."]
  - [LINE_BREAK]
  - [SET_WAIT, 32]
  - [TEXT, "So "]
  - [SET_WAIT, 24]
  - [TEXT, "you do know how"]
  - [LINE_BREAK]
  - [SET_WAIT, 4]
  - [TEXT, "to be a gentleman."]
  - [SET_WAIT, 16]
  - [SET_FLAG, 13]
  - [SET_WAIT, 32]
  - [NEXT_DIALOG]
  - [CLOSE_DIALOG]
  - [SCRIPT_UNKNOWN_11]
  - [END_CUTSCENE]
